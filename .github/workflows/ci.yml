name: CI

# Runs on every pull request and on every push to main, so a pull request shows
# whether the tests pass before it is merged.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # brings the tags, so the version check can see what is released

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Poll rules
        run: node test/core.test.mjs

      - name: Front-end and scripts parse
        run: |
          for f in public/app.js src/*.mjs netlify/functions/*.mjs scripts/*.mjs test/*.mjs dev-server.mjs; do
            node --check "$f"
          done

      - name: Version agrees everywhere
        run: node scripts/check-version.mjs

      - name: Pull request raises the version
        if: github.event_name == 'pull_request'
        run: node scripts/check-version.mjs --unreleased

  browser:
    # The browser walkthrough (test/browser.test.mjs): phone, tablet and desktop.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Browser walkthrough
        run: node test/browser.test.mjs

      - name: Keep screenshots of a failed walkthrough
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: /tmp/poll-browser-*.png
          if-no-files-found: ignore

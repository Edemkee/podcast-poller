<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recording night</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141b33'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d7263d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <p class="brand">Recording night</p>
    <div class="weeks" role="tablist" aria-label="Week" id="weeks"></div>
  </header>

  <main>
    <section class="verdict" id="verdict" aria-live="polite"></section>

    <form class="answer" id="answer" novalidate hidden>
      <label class="name">
        <span>Your name</span>
        <input id="name" type="text" maxlength="40" autocomplete="given-name">
      </label>
      <section class="week" id="week" aria-label="Days of the week"></section>
      <div class="send">
        <button type="submit" class="btn primary" id="submit">Submit my answer</button>
        <button type="button" class="btn quiet" id="cancel" hidden>Cancel</button>
        <p class="note" id="barNote" role="status"></p>
      </div>
    </form>

    <div class="outcome">
      <section class="results" id="results" aria-live="polite"></section>
      <section class="people" id="people"></section>
    </div>
  </main>

  <footer class="foot">Version 0.2</footer>

  <script src="app.js"></script>
</body>
</html>
